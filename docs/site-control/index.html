<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Site Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark-amber"]{
    --bg:#12151a; --surface:#1a1e25; --surface-2:#20252d; --line:#2a2f38;
    --text:#eef0f3; --muted:#8b93a1; --muted-2:#5f6672;
    --flag:#ff6a2b; --flag-dim:#7a3a1e; --chalk:#4fd1c5; --chalk-dim:#1f4744;
    --amber:#f5b942; --red:#ef5b5b;
    --grid: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px), repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px);
  }
  [data-theme="dark-teal"]{
    --bg:#0f1517; --surface:#161f22; --surface-2:#1c282c; --line:#25343a;
    --text:#e9f3f3; --muted:#87a0a0; --muted-2:#5a6f6f;
    --flag:#2dd4bf; --flag-dim:#134e4a; --chalk:#ff9d5c; --chalk-dim:#5c3a1a;
    --amber:#f5b942; --red:#ef5b5b;
    --grid: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px), repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 24px);
  }
  [data-theme="light"]{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eceef2; --line:#dde1e7;
    --text:#181b20; --muted:#5b6472; --muted-2:#88909c;
    --flag:#d9540f; --flag-dim:#fce3d3; --chalk:#0f9c8f; --chalk-dim:#d6f3f0;
    --amber:#b9790a; --red:#c8372f;
    --grid: repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 24px), repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 24px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;height:100%;overscroll-behavior:none;}
  #root{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
  ::-webkit-scrollbar{display:none;}
  * { scrollbar-width: none; }

  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  header.topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, transparent);
    padding:18px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .crosshair{width:26px;height:26px;position:relative;flex-shrink:0;}
  .crosshair::before,.crosshair::after{content:'';position:absolute;background:var(--flag);}
  .crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-1px);}
  .crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-1px);}
  .crosshair .dot{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;border:2px solid var(--bg);background:var(--flag);transform:translate(-50%,-50%);}
  .brand-text .t1{font-size:11px;letter-spacing:.14em;color:var(--muted-2);text-transform:uppercase;}
  .brand-text .t2{font-size:17px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1.1;}
  .rev-badge{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:3px 7px;border-radius:20px;font-family:'IBM Plex Mono',monospace;}

  main{flex:1;padding:0 16px 96px;overflow-y:auto;}
  .screen{display:none;animation:fade .25s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    max-width:560px;margin:0 auto;
    background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1;background:none;border:none;color:var(--muted-2);position:relative;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 2px;font-family:'Inter';font-size:10px;font-weight:600;letter-spacing:.02em;
  }
  nav.tabbar button svg{width:20px;height:20px;}
  nav.tabbar button.active{color:var(--flag);}
  nav.tabbar button .dot-badge{position:absolute;transform:translate(10px,-8px);width:7px;height:7px;border-radius:50%;background:var(--red);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .card:active{background:var(--surface-2);}
  .section-title{font-family:'Space Grotesk';font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;}
  .section-title .count{color:var(--muted-2);font-family:'IBM Plex Mono';font-size:11px;}
  .section-title .add-btn{background:var(--surface);border:1px solid var(--line);color:var(--flag);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:none;letter-spacing:0;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;}
  .stat .n{font-family:'Space Grotesk';font-size:20px;font-weight:700;}
  .stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat.flag .n{color:var(--flag);}
  .stat.chalk .n{color:var(--chalk);}
  .stat.red .n{color:var(--red);}

  /* Global snapshot grid (dashboard) */
  .global-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .global-cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;}
  .global-cell:active{background:var(--surface-2);}
  .global-cell .gn{font-family:'Space Grotesk';font-size:17px;font-weight:700;}
  .global-cell .gl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
  .global-cell .gp{font-size:10px;color:var(--muted-2);font-family:'IBM Plex Mono';margin-top:1px;}

  /* Phase progress bars */
  .phase-row{margin-bottom:10px;}
  .phase-row .ph-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
  .phase-row .ph-name{font-weight:600;}
  .phase-row .ph-pct{color:var(--muted-2);font-family:'IBM Plex Mono';font-size:11px;}
  .phase-bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
  .phase-bar-fill{height:100%;background:linear-gradient(90deg,var(--flag),var(--amber));border-radius:3px;}

  /* Job card */
  .job-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
  .job-card .jc-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .job-card .jc-name{font-family:'Space Grotesk';font-size:15px;font-weight:700;}
  .job-card .jc-client{font-size:12px;color:var(--muted);margin-top:2px;}
  .job-badge{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted-2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;}

  .hero{
    border-radius:18px;padding:20px;position:relative;overflow:hidden;
    background:var(--surface); border:1px solid var(--line);
    background-image:var(--grid);
  }
  .hero .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--flag);font-weight:600;}
  .hero h1{font-family:'Space Grotesk';font-size:22px;margin:6px 0 4px;line-height:1.2;}
  .hero p{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.5;}
  .progress-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:4px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--flag),var(--amber));border-radius:4px;}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-2);margin-top:6px;font-family:'IBM Plex Mono';}

  .chip-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;}
  .chip{flex-shrink:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}
  .chip.active{background:var(--flag);border-color:var(--flag);color:var(--bg);}

  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
  .b-complete{background:var(--chalk-dim);color:var(--chalk);}
  .b-progress{background:#3a3116;color:var(--amber);}
  .b-notstarted{background:var(--surface-2);color:var(--muted);}
  .b-recheck{background:#4a2020;color:var(--red);}
  .b-critical{background:var(--flag-dim);color:var(--flag);}
  .b-verified{background:var(--chalk-dim);color:var(--chalk);}

  .item-title{font-size:14px;font-weight:600;line-height:1.35;}
  .item-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .item-meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .id-tag{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted-2);}

  .day-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 8px;}
  .day-head .d1{font-family:'Space Grotesk';font-size:15px;font-weight:700;}
  .day-head .d2{font-size:11px;color:var(--muted-2);font-family:'IBM Plex Mono';}
  .block-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
  .block-row:first-child{border-top:none;}
  .block-time{width:56px;flex-shrink:0;font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);padding-top:1px;}
  .block-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .dot-field{background:var(--flag);} .dot-desk{background:var(--chalk);}
  .dot-late{background:var(--red);}

  .empty{text-align:center;padding:50px 20px;color:var(--muted-2);}
  .empty .ico{font-size:30px;margin-bottom:8px;}

  .search-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
  .search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Inter';}
  .search-bar input::placeholder{color:var(--muted-2);}

  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;}
  .sheet-overlay.open{display:block;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:51;
    background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
    max-height:82vh;overflow-y:auto;padding:10px 18px calc(28px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .28s ease;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 16px;}
  .sheet h2{font-family:'Space Grotesk';font-size:19px;margin:2px 0 8px;line-height:1.3;}
  .sheet .row{padding:11px 0;border-top:1px solid var(--line);}
  .sheet .row:first-of-type{border-top:none;}
  .sheet .row .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);margin-bottom:3px;}
  .sheet .row .v{font-size:14px;line-height:1.5;}
  .close-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:none;color:var(--muted);font-size:16px;}

  .field-input, .sheet select, .sheet input, .sheet textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;margin-top:4px;font-family:'IBM Plex Mono';}
  .sheet textarea{font-family:'Inter';resize:vertical;}

  .measure-fig{font-family:'IBM Plex Mono';font-size:18px;color:var(--flag);font-weight:600;}
  .tol{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted-2);}

  .fab{
    position:fixed;bottom:148px;right:calc(50% - 280px + 16px);z-index:25;
    background:var(--flag);color:var(--bg);border:none;width:52px;height:52px;border-radius:50%;
    font-size:22px;font-weight:700;box-shadow:0 8px 20px rgba(255,106,43,.35);
    display:flex;align-items:center;justify-content:center;
  }
  @media(max-width:600px){ .fab{right:16px;} }

  h3.group-h{font-family:'Space Grotesk';font-size:14px;color:var(--muted);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);}

  /* Settings tabs */
  .settings-tabs{display:flex;gap:6px;margin:10px 0 16px;border-bottom:1px solid var(--line);padding-bottom:0;}
  .settings-tab{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:8px 4px 10px;border-bottom:2px solid transparent;}
  .settings-tab.active{color:var(--flag);border-bottom-color:var(--flag);}
  .theme-swatch-row{display:flex;gap:10px;margin-top:8px;}
  .theme-swatch{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);position:relative;cursor:pointer;}
  .theme-swatch.selected{border-color:var(--flag);}
  .primary-btn{width:100%;background:var(--flag);color:var(--bg);border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;}
  .ghost-btn{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:600;font-size:13px;}
</style>
</head>
<body>
<div id="root">
  <header class="topbar">
    <div class="brand">
      <div class="crosshair"><div class="dot"></div></div>
      <div class="brand-text">
        <div class="t1">Site Control</div>
        <div class="t2" id="brandJobName">Site Control</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="rev-badge">R05</div>
      <button id="gearBtn" style="background:var(--surface);border:1px solid var(--line);width:34px;height:34px;border-radius:10px;color:var(--muted);font-size:15px;">⚙</button>
    </div>
  </header>
  <div id="syncBar" style="display:none;position:fixed;left:16px;right:16px;bottom:78px;max-width:528px;margin:0 auto;z-index:26;background:var(--flag);color:var(--bg);border-radius:12px;padding:11px 14px;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;">
    <span>Unsaved changes</span>
    <button onclick="openSettings('sync')" style="background:var(--bg);color:var(--flag);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px;">Sync to GitHub →</button>
  </div>

  <main id="main">
    <section id="screen-home" class="screen"></section>
    <section id="screen-tasks" class="screen"></section>
    <section id="screen-schedule" class="screen"></section>
    <section id="screen-measure" class="screen"></section>
    <section id="screen-photos" class="screen"></section>
    <section id="screen-materials" class="screen"></section>
    <section id="screen-log" class="screen"></section>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="sheet-overlay" id="overlay"></div>
  <div class="sheet" id="sheet"><button class="close-x" id="sheetClose">✕</button><div id="sheetBody"></div></div>
  <button class="fab" id="fab" onclick="fabClick()">+</button>
</div>

<script>
let DATA = null;
let DIRTY = false;
function today(){ return new Date().toISOString().slice(0,10); }

/* ---------- PERSISTENT PREFS & GITHUB CONFIG (localStorage, this device only) ---------- */
const PREFS_KEY = 'siteControlPrefs_v1';
const GH_KEY = 'siteControlGH_v1';
let PREFS = { theme:'dark-amber' };
let GH = { owner:'Leafsrule', repo:'renovations-command-center', branch:'main', path:'docs/site-control/data.json', token:'', remember:false };

function loadLocalPrefs(){
  try{
    const p = localStorage.getItem(PREFS_KEY);
    if(p) PREFS = Object.assign(PREFS, JSON.parse(p));
  }catch(e){}
  try{
    const g = localStorage.getItem(GH_KEY);
    if(g) GH = Object.assign(GH, JSON.parse(g));
  }catch(e){}
  applyTheme(PREFS.theme);
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); }catch(e){}
}
function saveGH(){
  try{
    if(GH.remember){ localStorage.setItem(GH_KEY, JSON.stringify(GH)); }
    else{ localStorage.removeItem(GH_KEY); }
  }catch(e){}
}
function forgetCredentials(){
  GH.token = ''; GH.remember = false;
  try{ localStorage.removeItem(GH_KEY); }catch(e){}
  openSettings('sync');
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
}

/* ---------- DATE FORMATTING (full format: Wed-Jul-29-2026) ---------- */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDateFull(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d.getTime())) return iso;
  return `${DOW[d.getDay()]}-${MON[d.getMonth()]}-${String(d.getDate()).padStart(2,'0')}-${d.getFullYear()}`;
}

/* ---------- DATA LOAD ---------- */
async function loadData(){
  try{
    const res = await fetch('./data.json', {cache:'no-store'});
    DATA = await res.json();
    if(!DATA.jobs) DATA.jobs = [];
  }catch(e){
    document.getElementById('main').innerHTML = `<div class="empty" style="padding-top:80px;"><div class="ico">⚠</div>Couldn't load data.json.<br>Make sure it sits next to index.html.</div>`;
    return;
  }
  renderAll();
}

/* ---------- JOBS & CLIENTS ---------- */
function jobById(id){ return DATA.jobs.find(j=>j['Job ID']===id); }
function jobLabel(id){ const j = jobById(id); return j ? `${j['Job Name']} · ${j.Client}` : (id||'—'); }
function nextJobId(){ return nextIdForPrefix(DATA.jobs, 'Job ID', 'JOB', 3); }
function addJob(name, client){
  if(!name || !client) return;
  const id = nextJobId();
  DATA.jobs.push({ 'Job ID': id, 'Job Name': name, 'Client': client, 'Status': 'Active' });
  markDirty();
  renderHome();
  return id;
}
function currentJobId(){
  return (DATA.jobs[0] && DATA.jobs[0]['Job ID']) || '';
}
function updateBrandJobName(){
  const el = document.getElementById('brandJobName');
  if(!el) return;
  if(DATA.jobs.length === 1) el.textContent = DATA.jobs[0]['Job Name'];
  else if(DATA.jobs.length > 1) el.textContent = `${DATA.jobs.length} active jobs`;
  else el.textContent = 'Site Control';
}

function markDirty(){
  DIRTY = true;
  document.getElementById('syncBar').style.display = 'flex';
}

/* ---------- GITHUB SYNC ---------- */
async function githubGetSha(){
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}?ref=${GH.branch}`;
  const res = await fetch(url, { headers:{ 'Authorization':`Bearer ${GH.token}`, 'Accept':'application/vnd.github+json' } });
  if(!res.ok) throw new Error(`Couldn't read current file (${res.status}). Check owner/repo/path/token.`);
  const json = await res.json();
  return json.sha;
}
async function githubCommit(message){
  const sha = await githubGetSha();
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
  const res = await fetch(url, {
    method:'PUT',
    headers:{ 'Authorization':`Bearer ${GH.token}`, 'Accept':'application/vnd.github+json' },
    body: JSON.stringify({ message: message || 'Update site control data', content, sha, branch: GH.branch })
  });
  if(!res.ok){ const t = await res.text(); throw new Error(`Commit failed (${res.status}): ${t.slice(0,200)}`); }
  return res.json();
}

/* ---------- TABS ---------- */
const TABS = [
  {id:'home', label:'Home', icon:'M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z'},
  {id:'tasks', label:'Tasks', icon:'M4 6h16M4 12h16M4 18h10'},
  {id:'schedule', label:'Schedule', icon:'M4 5h16v15H4zM4 9h16M8 3v4M16 3v4'},
  {id:'measure', label:'Measure', icon:'M3 17l6-6M3 17h4v-4M9 5l6 14M15 5h4v4'},
  {id:'photos', label:'Photos', icon:'M4 8h3l2-2h6l2 2h3v11H4z'},
  {id:'materials', label:'Materials', icon:'M4 7l8-4 8 4-8 4-8-4zM4 7v10l8 4 8-4V7M12 11v10'},
  {id:'log', label:'Decisions', icon:'M6 3h9l5 5v13H6zM14 3v6h5'}
];

let state = { tab:'home', taskFilter:'All', taskSearch:'', scheduleView:'day', measureFilter:'All' };

function svgIcon(d){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d.split('M').filter(Boolean).map(seg=>`<path d="M${seg}"/>`).join('')}</svg>`;
}

/* consistent Status vocabulary used everywhere */
const STATUS_OPTIONS = ['Not Started','In Progress','Complete','On Hold','Field Verified','Recheck Required','User Supplied'];

function statusBadge(status){
  if(!status) return `<span class="badge b-notstarted">—</span>`;
  const s = status.toLowerCase();
  if(s.includes('complete')||s.includes('verified')||s.includes('approved')) return `<span class="badge b-complete">${status}</span>`;
  if(s.includes('progress')) return `<span class="badge b-progress">${status}</span>`;
  if(s.includes('recheck')) return `<span class="badge b-recheck">${status}</span>`;
  return `<span class="badge b-notstarted">${status}</span>`;
}
function priorityBadge(p){
  if(!p) return '';
  if(p.toLowerCase()==='critical'||p==='P1') return `<span class="badge b-critical">${p}</span>`;
  return `<span class="badge b-notstarted">${p}</span>`;
}
function jobBadge(jobId){
  if(!jobId) return '';
  return `<span class="job-badge">${jobLabel(jobId)}</span>`;
}
function isLate(dateStr, status){
  if(!dateStr) return false;
  if(status && status.toLowerCase().includes('complete')) return false;
  return dateStr < today();
}

/* ---------- HOME (global dashboard, overhauled) ---------- */
function renderHome(){
  updateBrandJobName();
  const T = today();
  const tasks = DATA.tasks, blocks = DATA.dailySchedule, meas = DATA.measurements,
        mats = DATA.materials, decs = DATA.decisions, photos = DATA.photos;

  const taskComplete = tasks.filter(t=>t.Status==='Complete').length;
  const taskActive = tasks.filter(t=>t.Status==='In Progress').length;
  const taskOverdue = tasks.filter(t=>isLate(t['Planned Date'], t.Status));
  const measRecheck = meas.filter(m=>m.Status==='Recheck Required');
  const matsVerified = mats.filter(m=>(m['Verification Status']||'').toLowerCase().includes('verif') || (m['Verification Status']||'').toLowerCase().includes('complete')).length;
  const photosCaptured = photos.filter(p=>p.Status && p.Status!=='Not Captured' && p.Status!=='Not Started').length;
  const decsPending = decs.filter(d=>(d.Status||'').toLowerCase().includes('pending'));
  const blocksLate = blocks.filter(b=>isLate(b['Work Date'], b.Status));

  const todayCal = DATA.dailyCalendar.find(d=>d.Date===T);
  const dayIdx = todayCal ? todayCal['Day #'] : '—';
  const totalDays = DATA.dailyCalendar.length;
  const pctDays = todayCal ? Math.round((dayIdx/totalDays)*100) : 0;
  const todayBlocks = blocks.filter(b=>b['Work Date']===T);

  // Phase progress (tasks grouped by phase)
  const phases = [...new Set(tasks.map(t=>t.Phase))];
  const phaseRows = phases.map(ph=>{
    const inPhase = tasks.filter(t=>t.Phase===ph);
    const done = inPhase.filter(t=>t.Status==='Complete').length;
    const pct = inPhase.length ? Math.round((done/inPhase.length)*100) : 0;
    return `<div class="phase-row">
      <div class="ph-top"><span class="ph-name">${ph}</span><span class="ph-pct">${done}/${inPhase.length} · ${pct}%</span></div>
      <div class="phase-bar"><div class="phase-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  // Global "needs attention" — spans every entity type, not just tasks
  const attention = [
    ...taskOverdue.map(t=>({title:t.Task, sub:`Task overdue · planned ${formatDateFull(t['Planned Date'])}`, status:t.Status, pr:t.Priority, open:()=>openTask(t['Task ID'])})),
    ...blocksLate.map(b=>({title:b['Daily Task'], sub:`Schedule block overdue · ${formatDateFull(b['Work Date'])}`, status:b.Status, pr:b.Priority, open:()=>openScheduleBlock(b['Schedule ID'])})),
    ...measRecheck.map(m=>({title:m.Element, sub:`Measurement needs recheck · ${m.Zone||''}`, status:m.Status, pr:'', open:()=>openMeasurement(m['Measurement ID'])})),
    ...decsPending.map(d=>({title:d.Subject, sub:`Decision pending approval`, status:d.Status, pr:'', open:()=>openDecision(d['Decision ID'])})),
  ].slice(0, 8);

        <div><div class="jc-name">${j['Job Name']}</div><div class="jc-client">Client: ${j.Client}</div></div>
        <span class="job-badge">${j['Job ID']}</span>
      </div>

      <div class="progress-label"><span>${done}/${jt.length} tasks complete</span><span style="${overdue?'color:var(--red)':''}">${overdue} overdue</span></div>
    </div>`;
  }).join('');

  let html = `
    <div class="hero">
      <div class="eyebrow">Day ${dayIdx} of ${totalDays} · ${todayCal ? todayCal.Phase : ''}</div>
      <h1>${todayCal ? todayCal['Main Objective'] : 'Planning window'}</h1>
      <p>${todayCal ? todayCal['Milestone / Done When'] : ''}</p>
      <div class="progress-track"><div class="progress-fill" style="width:${pctDays}%"></div></div>
      <div class="progress-label"><span>${formatDateFull(T)}</span><span>${pctDays}% through planning horizon</span></div>
    </div>

    <div class="section-title">Global snapshot</div>
    <div class="global-grid">

    <div class="section-title">Jobs <span class="count">${DATA.jobs.length}</span></div>

/* ---------- SCHEDULE (real-time, multiple view modes) ---------- */
const SCHEDULE_VIEWS = [
  {id:'day', label:'Day'}, {id:'week', label:'Week'}, {id:'month', label:'Month'},
  {id:'job', label:'Job'}, {id:'client', label:'Client'}, {id:'late', label:'Late'}
];
function setScheduleView(v){ state.scheduleView = v; renderSchedule(); }

function scheduleBlockRow(b){
  const late = isLate(b['Work Date'], b.Status);
  return `<div class="block-row" onclick="openScheduleBlock('${b['Schedule ID']}')">
    <div class="block-time">${b['Time Block']||''}</div>
    <div class="block-dot ${late?'dot-late':(b['Work Mode']==='Field'?'dot-field':'dot-desk')}"></div>
    <div style="flex:1;">
      <div class="item-title" style="font-size:13px;">${b['Daily Task']}</div>
      <div class="item-meta">${statusBadge(b.Status)}${late?'<span class="badge b-recheck">Late</span>':''}<span class="id-tag">${formatDateFull(b['Work Date'])} · ${b['Planned Hours']}h</span>${jobBadge(b['Job ID'])}</div>
    </div>
  </div>`;
}

function renderSchedule(){
  const T = today();
  const blocks = DATA.dailySchedule;
  const view = state.scheduleView;

  let html = `<div class="chip-row">${SCHEDULE_VIEWS.map(v=>`<div class="chip ${view===v.id?'active':''}" onclick="setScheduleView('${v.id}')">${v.label}</div>`).join('')}</div>`;

  if(view==='late'){
    const late = blocks.filter(b=>isLate(b['Work Date'], b.Status)).sort((a,b)=>a['Work Date']<b['Work Date']?-1:1);
    html += `<div class="section-title">Late blocks — live <span class="count">${late.length}</span></div>`;
    html += late.length ? `<div class="card" style="padding:4px 14px;">${late.map(scheduleBlockRow).join('')}</div>` : `<div class="empty"><div class="ico">✓</div>Nothing is late right now.</div>`;
  }
  else if(view==='job' || view==='client'){
    const groups = {};
    blocks.forEach(b=>{
      const j = jobById(b['Job ID']);
      const key = view==='job' ? (j ? j['Job Name'] : (b['Job ID']||'Unassigned')) : (j ? j.Client : 'Unassigned');
      (groups[key] = groups[key] || []).push(b);
    });
    Object.keys(groups).sort().forEach(key=>{
      const rows = groups[key].sort((a,b)=>a['Work Date']<b['Work Date']?-1:1);
      html += `<div class="day-head"><div class="d1">${key}</div><div class="d2">${rows.length} blocks</div></div>`;
      html += `<div class="card" style="padding:4px 14px;">${rows.map(scheduleBlockRow).join('')}</div>`;
    });
  }
  else if(view==='week'){
    const groups = {};
    blocks.forEach(b=>{
      const wk = b['Week'] || '—';
      (groups[wk] = groups[wk] || []).push(b);
    });
    Object.keys(groups).sort((a,b)=>Number(a)-Number(b)).forEach(wk=>{
      const rows = groups[wk].sort((a,b)=>a['Work Date']<b['Work Date']?-1:1);
      const isCurrentWeek = rows.some(r=>r['Work Date']===T);
      html += `<div class="day-head"><div class="d1">Week ${wk}${isCurrentWeek?' <span style="color:var(--flag)">● current</span>':''}</div><div class="d2">${rows.length} blocks</div></div>`;
      html += `<div class="card" style="padding:4px 14px;">${rows.map(scheduleBlockRow).join('')}</div>`;
    });
  }
  else if(view==='month'){
    const groups = {};
    blocks.forEach(b=>{
      const m = (b['Work Date']||'').slice(0,7);
      (groups[m] = groups[m] || []).push(b);
    });
    Object.keys(groups).sort().forEach(m=>{
      const rows = groups[m].sort((a,b)=>a['Work Date']<b['Work Date']?-1:1);
      const d = new Date(m+'-01T00:00:00');
      const label = isNaN(d.getTime()) ? m : `${MON[d.getMonth()]}-${d.getFullYear()}`;
      const isCurrentMonth = m === T.slice(0,7);
      html += `<div class="day-head"><div class="d1">${label}${isCurrentMonth?' <span style="color:var(--flag)">● current</span>':''}</div><div class="d2">${rows.length} blocks</div></div>`;
      html += `<div class="card" style="padding:4px 14px;">${rows.map(scheduleBlockRow).join('')}</div>`;
    });
  }
  else { // day (default)
    const days = {};
    blocks.forEach(b=>{ (days[b['Work Date']] = days[b['Work Date']] || []).push(b); });
    Object.keys(days).sort().forEach(date=>{
      const cal = DATA.dailyCalendar.find(d=>d.Date===date);
      const isToday = date === T;
      html += `<div class="day-head"><div class="d1">${cal?cal.Day:''} · ${formatDateFull(date)}${isToday?' <span style="color:var(--flag)">● today</span>':''}</div><div class="d2">Day ${cal?cal['Day #']:''}/${DATA.dailyCalendar.length}</div></div>`;
      html += `<div class="card" style="padding:4px 14px;">${days[date].map(scheduleBlockRow).join('')}</div>`;
    });
  }
  document.getElementById('screen-schedule').innerHTML = html || `<div class="empty">No schedule data.</div>`;
}

/* ---------- EDIT INFRASTRUCTURE ---------- */
const SCHEMAS = {
  task:     {idField:'Task ID', arr:'tasks', fields:['Task ID','Job ID','Phase','Category','Task','Status','Priority','Owner','Dependency','Planned Date','Completed Date','Completion / Evidence Requirement','Evidence Reference / File Name','Coordinate / Location','Notes']},
  block:    {idField:'Schedule ID', arr:'dailySchedule', fields:['Schedule ID','Job ID','Work Date','Day','Week','Phase','Time Block','Task ID(s)','Daily Task','Planned Hours','Priority','Work Mode','Status']},
  measure:  {idField:'Measurement ID', arr:'measurements', fields:['Measurement ID','Job ID','Zone','Element','From / Datum','To / Point','Direction / Method','Feet','Inches','Decimal Feet','Tolerance / Accuracy','Status','Date','Linked Task','Notes']},
  material: {idField:'Item ID', arr:'materials', fields:['Item ID','Job ID','Item Description','Category','Existing / New','Quantity','Unit','Dimensions / Specification','Condition','Intended Use','Verification Status','Source / Store','Notes']},
  decision: {idField:'Decision ID', arr:'decisions', fields:['Decision ID','Job ID','Date','Subject','Decision / Revision','Reason','Affects','Revision','Status','Approved By','Evidence Reference','Notes']},
  photo:    {idField:'Photo ID', arr:'photos', fields:['Photo ID','Job ID','Required View / Subject','Capture Point','Direction','Include Scale','Expected File Name','Status','Linked Task','Coordinates','Notes']}
};
const OPEN_FN = {};
const TASK_PHASE_PREFIX = {
  'Project Controls':'PC','Existing Conditions':'PH','Measurements':'MS','Materials':'MT',
  'Drawings':'DR','BOM & Costing':'BOM','Review & Approval':'RV'
};
const ID_RULES = {
  task:     {prefixFromPhase:true, pad:3},
  block:    {prefix:'DS', pad:3},
  measure:  {prefix:'MEAS', pad:3},
  material: {prefix:'MAT', pad:3},
  decision: {prefix:'DEC', pad:3},
  photo:    {prefix:'SITE', pad:2}
};
function nextIdForPrefix(arr, idField, prefix, pad){
  let max = 0;
  arr.forEach(r=>{
    const v = r[idField];
    if(typeof v === 'string' && v.startsWith(prefix+'-')){
      const n = parseInt(v.slice(prefix.length+1),10);
      if(!isNaN(n) && n>max) max = n;
    }
  });
  return prefix + '-' + String(max+1).padStart(pad,'0');
}
function generateId(kind, phase){
  const s = SCHEMAS[kind];
  const rule = ID_RULES[kind];
  const prefix = rule.prefixFromPhase ? (TASK_PHASE_PREFIX[phase] || 'GEN') : rule.prefix;
  return nextIdForPrefix(DATA[s.arr], s.idField, prefix, rule.pad);
}
function findRecord(kind, id){
  const s = SCHEMAS[kind];
  return DATA[s.arr].find(x=>x[s.idField]===id);
}
function esc(v){ return (v===undefined||v===null?'':String(v)).replace(/"/g,'&quot;'); }

function updateField(kind, id, field, value){
  const rec = findRecord(kind, id); if(!rec) return;
  rec[field] = value;
  markDirty();
  ({task:renderTasks, block:renderSchedule, measure:renderMeasure, material:renderMaterials, decision:renderLog, photo:renderPhotos})[kind]();
  renderHome();
}
function editRow(kind, id, label, field, value, opts){
  opts = opts || {};
  const oc = `updateField('${kind}','${String(id).replace(/'/g,"\\'")}','${field}',this.value)`;
  if(opts.select){
    const options = opts.select.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${o}</option>`).join('');
    return `<div class="row"><div class="k">${label}</div><select onchange="${oc}">${options}</select></div>`;
  }
  if(opts.textarea){
    return `<div class="row"><div class="k">${label}</div><textarea onblur="${oc}" rows="3">${esc(value)}</textarea></div>`;
  }
  return `<div class="row"><div class="k">${label}</div><input type="${opts.type||'text'}" value="${esc(value)}" onblur="${oc}"></div>`;
}
function jobSelectRow(kind, id, currentJobId){
  const options = DATA.jobs.map(j=>`<option value="${j['Job ID']}" ${j['Job ID']===currentJobId?'selected':''}>${j['Job Name']} · ${j.Client} (${j['Job ID']})</option>`).join('');
  return `<div class="row"><div class="k">Job / Client</div><select onchange="updateField('${kind}','${String(id).replace(/'/g,"\\'")}','Job ID',this.value)">${options}</select></div>`;
}
function addNew(kind, phase, jobId){
  const s = SCHEMAS[kind];
  const rec = {}; s.fields.forEach(f=>rec[f]='');
  if(kind==='task' && phase) rec.Phase = phase;
  rec['Job ID'] = jobId || currentJobId();
  const newId = generateId(kind, phase);
  rec[s.idField] = newId;
  if('Status' in rec) rec.Status = 'Not Started';
  DATA[s.arr].unshift(rec);
  markDirty();
  ({task:renderTasks, block:renderSchedule, measure:renderMeasure, material:renderMaterials, decision:renderLog, photo:renderPhotos})[kind]();
  renderHome();
  OPEN_FN[kind](newId);
}
function openPhasePicker(){
  const phases = Object.keys(TASK_PHASE_PREFIX);
  document.getElementById('sheetBody').innerHTML = `<h2>New task — choose phase</h2>
    <p style="color:var(--muted);font-size:12.5px;line-height:1.5;">The task ID follows your existing numbering, e.g. the next Project Controls task becomes <span class="mono">PC-009</span>.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">
      ${phases.map(p=>`<button class="chip" style="margin:0;" onclick="addNew('task','${p.replace(/'/g,"\\'")}')">${p} <span class="mono" style="opacity:.55">${TASK_PHASE_PREFIX[p]}</span></button>`).join('')}
    </div>`;
  openSheetRaw();
}

/* ---------- NAV ---------- */
function renderTabbar(){
  document.getElementById('tabbar').innerHTML = TABS.map(t=>`
    <button class="${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">
      ${svgIcon(t.icon)}
      <span>${t.label}</span>
    </button>`).join('');
}
const FAB_KIND = { tasks:'task', schedule:'block', measure:'measure', photos:'photo', materials:'material', log:'decision' };
function fabClick(){
  const k = FAB_KIND[state.tab];
  if(!k) return;
  if(k==='task'){ openPhasePicker(); return; }
  addNew(k);
}
function setTab(id){
  state.tab = id;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  renderTabbar();
  document.getElementById('main').scrollTop = 0;
  document.getElementById('fab').style.display = FAB_KIND[id] ? 'flex' : 'none';
}

function renderAll(){
  renderHome(); renderTasks(); renderSchedule(); renderMeasure(); renderPhotos(); renderMaterials(); renderLog();
  renderTabbar();
  setTab(state.tab);
}

/* ---------- SETTINGS (global menu: Preferences / Jobs & Clients / Sync) ---------- */
let settingsTab = 'prefs';
function openSettings(tab){
  settingsTab = tab || settingsTab || 'prefs';
  const tabs = [
    {id:'prefs', label:'Preferences'},
    {id:'jobs', label:'Jobs & Clients'},
    {id:'sync', label:'Sync'}
  ];
  let body = `<h2>Settings</h2>
    <div class="settings-tabs">${tabs.map(t=>`<button class="settings-tab ${settingsTab===t.id?'active':''}" onclick="openSettings('${t.id}')">${t.label}</button>`).join('')}</div>`;

  if(settingsTab==='prefs'){
    const themes = [
      {id:'dark-amber', name:'Dark · Amber'},
      {id:'dark-teal', name:'Dark · Teal'},
      {id:'light', name:'Light'}
    ];
    body += `<div class="row"><div class="k">Theme</div>
      <div class="theme-swatch-row">
        ${themes.map(t=>`<div title="${t.name}" class="theme-swatch ${PREFS.theme===t.id?'selected':''}" data-theme="${t.id}" onclick="setTheme('${t.id}')" style="background:${t.id==='light'?'#f4f5f7':(t.id==='dark-teal'?'#0f1517':'#12151a')}"></div>`).join('')}
      </div>
    </div>
    <div class="row"><div class="k">Date format</div><div class="v">Full — e.g. ${formatDateFull(today())}</div></div>`;
  }
  else if(settingsTab==='jobs'){
    body += `<div class="row"><div class="k">Existing jobs</div><div style="margin-top:8px;">
      ${DATA.jobs.map(j=>`<div class="job-card"><div class="jc-top"><div><div class="jc-name">${j['Job Name']}</div><div class="jc-client">Client: ${j.Client}</div></div><span class="job-badge">${j['Job ID']}</span></div></div>`).join('') || '<div style="color:var(--muted);font-size:13px;">No jobs yet.</div>'}
    </div></div>
    <div class="row"><div class="k">Add a new job</div>
      <input id="newJobName" placeholder="Job name" style="margin-top:6px;">
      <input id="newJobClient" placeholder="Client name" style="margin-top:8px;">
      <button class="primary-btn" style="margin-top:10px;" onclick="submitNewJob()">Add job</button>
    </div>`;
  }
  else if(settingsTab==='sync'){
    body += `<p style="color:var(--muted);font-size:12.5px;line-height:1.5;margin-top:-4px;">
      Paste a fine-grained personal access token scoped to just this repo, with <b>Contents: Read & Write</b> permission.
    </p>
    <div class="row"><div class="k">Owner / Repo</div>
      <div style="display:flex;gap:6px;margin-top:4px;">
        <input id="ghOwner" value="${GH.owner}" style="flex:1;">
        <input id="ghRepo" value="${GH.repo}" style="flex:1;">
      </div>
    </div>
    <div class="row"><div class="k">Branch</div><input id="ghBranch" value="${GH.branch}"></div>
    <div class="row"><div class="k">Path to data.json in repo</div><input id="ghPath" value="${GH.path}"></div>
    <div class="row"><div class="k">Personal access token</div><input id="ghToken" type="password" value="${GH.token}" placeholder="github_pat_..."></div>
    <div class="row" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="ghRemember" ${GH.remember?'checked':''} style="width:auto;margin:0;">
      <label for="ghRemember" style="font-size:12.5px;color:var(--muted);">Remember token on this device (stored in this browser only, until you forget it)</label>
    </div>
    <div class="row"><div class="k">Commit message</div><input id="ghMsg" placeholder="Update task/schedule status" style="font-family:'Inter';"></div>
    <div id="ghStatus" style="font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;"></div>
    <button class="primary-btn" onclick="doCommit()">Commit ${DIRTY ? 'changes' : '(no local changes)'} to GitHub</button>
    ${GH.remember || GH.token ? `<button class="ghost-btn" style="margin-top:8px;" onclick="forgetCredentials()">Forget saved token</button>` : ''}`;
  }

  document.getElementById('sheetBody').innerHTML = body;
  openSheetRaw();
}
function setTheme(id){
  PREFS.theme = id;
  applyTheme(id);
  savePrefs();
  openSettings('prefs');
}
function submitNewJob(){
  const name = document.getElementById('newJobName').value.trim();
  const client = document.getElementById('newJobClient').value.trim();
  if(!name || !client) return;
  addJob(name, client);
  document.getElementById('newJobName').value = '';
  document.getElementById('newJobClient').value = '';
  openSettings('jobs');
}
async function doCommit(){
  GH.owner = document.getElementById('ghOwner').value.trim();
  GH.repo = document.getElementById('ghRepo').value.trim();
  GH.branch = document.getElementById('ghBranch').value.trim();
  GH.path = document.getElementById('ghPath').value.trim();
  GH.token = document.getElementById('ghToken').value.trim();
  GH.remember = document.getElementById('ghRemember').checked;
  const msg = document.getElementById('ghMsg').value.trim();
  saveGH();
  const statusEl = document.getElementById('ghStatus');
  if(!GH.token){ statusEl.textContent = 'Paste a token first.'; statusEl.style.color = 'var(--red)'; return; }
  statusEl.textContent = 'Committing…'; statusEl.style.color = 'var(--muted)';
  try{
    await githubCommit(msg);
    DIRTY = false;
    document.getElementById('syncBar').style.display = 'none';
    statusEl.textContent = 'Committed ✓ — synced to ' + GH.owner + '/' + GH.repo;
    statusEl.style.color = 'var(--chalk)';
  }catch(e){
    statusEl.textContent = e.message;
    statusEl.style.color = 'var(--red)';
  }
}
document.getElementById('gearBtn').onclick = () => openSettings('prefs');

/* ---------- INIT ---------- */
loadLocalPrefs();
loadData();
// keep "late" / "today" indicators genuinely real-time even if the tab is left open
setInterval(()=>{ if(DATA){ renderHome(); if(state.tab==='schedule') renderSchedule(); } }, 60000);</script>
