name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Validate production infrastructure
        run: npm run validate:production
      - name: Validate Render Blueprint
        run: npm run validate:render
      - name: Validate Firebase rules configuration
        run: npm run validate:firebase
      - name: Build Next.js app
        run: npm run build
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
