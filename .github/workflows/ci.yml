name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/renovations-command-center
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/renovations-command-center/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Build Next.js app
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: fake-auth-domain
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: fake-project-id
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: fake-storage-bucket
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: fake-messaging-sender-id
          NEXT_PUBLIC_FIREBASE_APP_ID: fake-app-id
        run: npm run build
      - name: Run npm audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test

  backend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/renovations-command-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/renovations-command-center/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test trusted commands and client authorization rules
        run: npx --yes firebase-tools@15 emulators:exec --project demo-renovations-racp --only firestore,storage 'npm run test:backend'

  site-control-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-app-isolation.mjs
